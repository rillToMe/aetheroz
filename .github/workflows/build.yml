name: Build Kyuzen OS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bootable ISO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld make nasm xorriso limine

      - name: Prepare Limine tools
        shell: bash
        run: |
          set -euo pipefail

          install -m 755 "$(command -v limine)" limine/limine.exe

          for asset in BOOTX64.EFI limine-bios.sys limine-bios-cd.bin limine-uefi-cd.bin; do
            source_path="$(dpkg -L limine | grep -m 1 "/${asset}$" || true)"
            if [[ -z "${source_path}" ]]; then
              echo "Limine asset not found: ${asset}" >&2
              exit 1
            fi
            install -m 644 "${source_path}" "limine/${asset}"
          done

      - name: Build Kyuzen OS
        run: |
          make clean clean-apps
          make --jobs="$(nproc)" boot_image.iso

      - name: Upload bootable image
        uses: actions/upload-artifact@v4
        with:
          name: kyuzen-os-${{ github.sha }}
          path: |
            boot_image.iso
            myos.bin
            *.elf
          if-no-files-found: error
          retention-days: 14
